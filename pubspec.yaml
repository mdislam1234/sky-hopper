name: sky_hopper
description: "Sky Hopper — a vertical arcade jumping game."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.9
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: android/play_store_assets/sky_hopper_play_icon_512.png
  min_sdk_android: 24
  adaptive_icon_background: "#1677F8"
  adaptive_icon_foreground: assets/branding/app_icon_adaptive_foreground.png
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/branding/app_icon_adaptive_foreground.png

